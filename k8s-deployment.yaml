apiVersion: apps/v1
kind: Deployment
metadata:
  name: maven-webapp
  labels:
    app: maven-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maven-webapp
  template:
    metadata:
      labels:
        app: maven-webapp
    spec:
      containers:
      - name: webapp
        image: DOCKERHUB_USERNAME/jenkins-k8s-guide-app:latest # Replace with your DockerHub ID
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: maven-webapp-service
spec:
  type: NodePort
  selector:
    app: maven-webapp
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31000 # App accessible at http://192.168.1
